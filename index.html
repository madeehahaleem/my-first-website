<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Connect JavaScript file -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>
    <p>I am learning full stack development.</p>

    <!-- Welcome Button -->
    <button type="button" onclick="alert('Welcome to my website!')">
        Click Me
    </button>

    <br><br>

    <!-- Name Input -->
    <input
        type="text"
        id="username"
        placeholder="Enter your name"
    >

    <button type="button" onclick="greetUser()">
        Submit
    </button>

    <!-- Web Development Skills -->
    <div class="my-box">
        <div>HTML</div>
        <div>CSS</div>
        <div>JavaScript</div>
    </div>

    <!-- About Me Card -->
    <div class="card" id="about">
        <h2>About Me</h2>
        <p>I am a beginner full stack developer.</p>
    </div>

    <!-- Contact Form -->
    <div class="card" id="contact">
        <h2>Contact Me</h2>

        <form onsubmit="return validateForm(event)">
            <input
                type="text"
                id="contactName"
                placeholder="Your name"
                required
            >

            <br><br>

            <input
                type="email"
                id="contactEmail"
                placeholder="Your email"
                required
            >

            <br><br>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- Website Image -->
    <img
        src="https://placehold.co/300*180"
        alt="Sample website image"
        class="profile-image"
    >

</body>
</html>
